<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Login Demo</h1>

        <div class="columns">
            <section class="card">
                <h2>Sign Up</h2>
                <form id="signup-form">
                    <input type="text"     id="signup-username" placeholder="Username" required>
                    <input type="email"    id="signup-email"    placeholder="Email"    required>
                    <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required minlength="6">
                    <button type="submit">Create account</button>
                </form>
                <p id="signup-msg" class="msg"></p>
            </section>

            <section class="card">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text"     id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Log in</button>
                </form>
                <p id="login-msg" class="msg"></p>
            </section>
        </div>
    </div>

    <script>

        async function postJSON(url, data){
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data),

            });
            return {status: res.status, body: await res.json()};
        }

        //signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('signup-msg');
            const data = {
                username: document.getElementById('signup-username').value.trim(),
                email: document.getElementById('signup-email').value.trim(),
                password: document.getElementById('signup-password').value,
            };

            if (!data.username || !data.email || data.password.length < 6) {
                msg.textContent = 'Please fill in all the fields (password >= 6 chars).';
                msg.className = 'msg-error';
                return;
            }

            try{
                const {status, body} = await postJSON('/api/signup', data);
                if (status === 201){
                    msg.textContent=`Account created! Welcome, ${body.username}`;
                    msg.className= 'msg-success'
                    e.target.reset();
                }else {
                    msg.textContent = body.message || 'signup failed.';
                    msg.className='msg-error';
                }
            }catch (err) {
                msg.textContent = 'Network error'
                msg.className= 'msg-error'
            }
        });

        //login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('login-msg');
            const data = {
                username: document.getElementById('login-username').value.trim(),
                password: document.getElementById('login-password').value,
            };

            if (!data.username || !data.password){
                msg.textContent = 'Please fill in both fields';
                msg.className = 'msg-error';
                return;
            }

            try{
                const {status, body} = await postJSON('/api/login', data);
                if (status === 200){
                    msg.textContent = `Welcome back, ${body.username}`;
                    msg.className = 'msg-success';
                    e.target.reset();
                }else {
                    msg.textContent = body.message || 'Login failed'
                    msg.className = 'msg-error';
                }

            }catch (err) {
                msg.textContent = 'Network error'
                msg.className = 'msg-error';
            }
        });
        
    </script>

</body>
</html>
